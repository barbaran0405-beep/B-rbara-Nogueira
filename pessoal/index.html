/* ---------- Capacidades do Claude (db + sample), com alternativa local ---------- */
const use = (name) => (window.claude && window.claude.use) ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
let sample = null;

const Store = {
  mode: "local", base: null,
  async init() {
    const [db, user] = await Promise.all([use("db"), use("user")]);
    const uid = user ? await user.id().catch(() => null) : null;
    if (db && uid) { this.mode = "db"; this.base = db.doc("data/users/" + uid + "/perfil"); }
  },
  lsGet(k, d) { try { const v = localStorage.getItem("jae:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  lsSet(k, v) { try { localStorage.setItem("jae:" + k, JSON.stringify(v)); } catch {} },
  async getProfile() {
    if (this.mode === "db") { const s = await this.base.get(); return s.exists ? s.data() : null; }
    return this.lsGet("perfil", null);
  },
  async saveProfile(p) { if (this.mode === "db") return this.base.set(p); this.lsSet("perfil", p); },
  async add(col, data) {
    const row = { ...data, createdAt: new Date().toISOString() };
    if (this.mode === "db") { const ref = await this.base.collection(col).add(row); return { id: ref.id, ...row }; }
    const list = this.lsGet(col, []); const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    list.push({ id, ...row }); this.lsSet(col, list); return { id, ...row };
  },
  async list(col, n = 200) {
    if (this.mode === "db") {
      const s = await this.base.collection(col).orderBy("createdAt", "desc").limit(n).get();
      return s.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    return this.lsGet(col, []).slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, n);
  },
  async update(col, id, patch) {
    if (this.mode === "db") return this.base.collection(col).doc(id).update(patch);
    this.lsSet(col, this.lsGet(col, []).map(r => r.id === id ? { ...r, ...patch } : r));
  },
  async clear(col) {
    if (this.mode === "db") { const s = await this.base.collection(col).get(); for (const d of s.docs) await this.base.collection(col).doc(d.id).delete(); return; }
    this.lsSet(col, []);

function aiError(e) {
  const c = e && e.code;
  if (c === "not_granted") return "Você não liberou o uso do Claude nesta página. Recarregue a página e toque em permitir.";
  if (c === "rate_limited") return "Muitos pedidos seguidos. Espere um minuto e tente de novo.";
  if (c === "invalid_json") return "A resposta veio num formato inesperado. Tente de novo.";
  if (c === "unavailable") return "A IA do Claude não está disponível aqui. Abra o app pelo Claude.";
  if (c === "cancelled") return "";
  return "Não consegui gerar agora. Tente de novo.";
}
async function askJSON(task, data) {
  if (!sample) throw { code: "unavailable" };
  return sample.json(GUARDRAILS + "\n\n" + task + "\n\nDados:\n" + JSON.stringify(data, null, 1));
}
async function askText(task, data) {
  if (!sample) throw { code: "unavailable" };
  const r = await sample(GUARDRAILS + "\n\n" + task + "\n\nDados:\n" + JSON.stringify(data, null, 1), { cache: false });
  return r.text.trim();
}

/* ---------- Ajudantes de DOM ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false && k !== "") el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const view = document.getElementById("view");
const top = document.getElementById("top");
document.getElementById("back").onclick = () => go("home");
function screen(title, ...kids) {
  top.hidden = title === null;
  document.getElementById("topTitle").textContent = title || "";
  view.replaceChildren(...kids.flat().filter(Boolean));
  view.classList.remove("screen"); void view.offsetWidth; view.classList.add("screen");
  window.scrollTo(0, 0);
}

        const r = await askJSON(`Modo Crise: a pessoa relatou um fato que a fez duvidar. Separe de forma estruturada, usando o contexto dela. Sem positividade tóxica. "respostaIdentidadeAssumida" termina com uma ação concreta possível hoje.
Responda só com JSON: {"interpretacao":"...","medo":"...","padraoAntigo":"...","respostaIdentidadeAssumida":"..."}`, { ...(await context()), fato: fato.value.trim() });
        parts.forEach(p => { if (r[p.k]) p.ta.value = String(r[p.k]); }); check();
      } catch (e) { err.textContent = aiError(e); }
      busy(ai[0], false, "Pedir para o Claude separar");
    });
    screen("Estou duvidando", h("h1", {}, "Estou duvidando"),
      h("p", { class: "lead" }, "Separe o que aconteceu do que você está contando a si mesma sobre isso."),
      h("div", { class: "field" }, h("span", { class: "label" }, "Fato"), fato), parts.map(p => p.el),
      h("details", {}, h("summary", { class: "note", style: "text-align:left;cursor:pointer" }, "Ver meu DNA assumido"), h("div", { class: "card", style: "margin-top:10px" }, profile.dna.assumido)),
      err, save, ai || null);
  },

  async privacy() {
    const err = h("p", { class: "err" });
    const exp = h("button", { class: "ghost", style: "text-align:center" }, "Exportar meus dados");
    const dl = await use("downloads");
    exp.hidden = !dl;
    exp.onclick = async () => {
      try {
        const data = { perfil: profile };
        for (const c of ["cenas","diario","desafios","conversa"]) data[c] = await Store.list(c, 1000);
        await dl.save({ filename: "ja-e-meus-dados.json", data: JSON.stringify(data, null, 2) });
      } catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") err.textContent = "Não consegui exportar agora."; }
    };
    const confirmBtn = (label, warn, action) => {
      const b = h("button", { class: "ghost danger" }, label); let armed = false;
      b.onclick = async () => { if (!armed) { armed = true; b.textContent = warn; return; } b.disabled = true; await action(); };
      return b;
    };
    const cb = h("input", { type: "checkbox", id: "ai-on" }); cb.checked = !!profile.aiOn; cb.disabled = !sample;
    cb.onchange = async () => { profile.aiOn = cb.checked; await Store.saveProfile(profile); };
    screen("Privacidade",
      h("h1", {}, "Seu DNA, IA e dados"),
      h("button", { class: "ghost", onclick: () => go("dna") }, "Rever meu DNA atual e assumido"),
      h("span", { class: "label" }, "IA do Claude"),
      h("label", { class: "switch", for: "ai-on" },
        h("span", {}, h("b", { style: "font-weight:500" }, "Usar a IA do Claude"), h("small", { class: "lead" }, sample ? "Desligada, o app não gasta nada do seu limite. Ligada, cenas, respostas do eu assumido e desafios passam a ser escritos pelo Claude e cada um gasta seu limite." : "Disponível só quando você abre o app pelo Claude.")), cb),
      h("span", { class: "label" }, "Seus dados"),
      h("p", { class: "lead" }, Store.mode === "db" ? "Seus registros ficam numa área privada da sua conta Claude. Ninguém mais vê, nem quem você compartilhar o link." : "Neste modo, seus registros ficam só neste navegador."),
      exp, err,
      h("span", { class: "label" }, "Zona de risco"),
      confirmBtn("Apagar minha realidade", "Toque de novo para apagar a realidade e as cenas", async () => { await Store.clear("cenas"); delete profile.reality; await Store.saveProfile(profile); go("reality-select"); }),
      confirmBtn("Apagar tudo e recomeçar", "Toque de novo para apagar tudo, sem volta", async () => { await Store.deleteAll(); profile = null; go("onboarding"); }),
    );
  },
};

function dnaAtual(a) {
  return Object.keys(QLABEL).filter(k => a[k]).map(k => `${QLABEL[k]}: ${a[k]}`).join("\n");
}

async function evidenceList() {
  const [des, dia, cen] = await Promise.all([Store.list("desafios", 100), Store.list("diario", 200), Store.list("cenas", 200)]);
  return [
    ...des.filter(d => d.status === "done").map(d => ({ origin: "Desafio", text: d.description, note: d.reflection, date: d.closedAt || d.createdAt })),
    ...dia.filter(d => d.category === "evidencia").map(d => ({ origin: "Diário", text: d.content, date: d.createdAt })),
    ...cen.filter(c => c.chosen === "a" && c.resposta).map(c => ({ origin: "Modo realidade", text: c.chosenLabel, note: c.resposta, date: c.createdAt })),
  ].sort((a, b) => b.date.localeCompare(a.date));
}

/* Cena do banco: segue a ordem, sem repetir até acabar as da área. */
function bankScene(cenas) {
  const bank = SCENES[profile.reality.area] || SCENES.profissional;
  const used = new Set(cenas.map(c => c.narrative));
  const pick = bank.find(s => !used.has(s[0])) || bank[cenas.length % bank.length];
  return { narrative: pick[0], options: pick[1].map((label, i) => ({ id: "abc"[i], label })), recap: false, source: "banco" };
}

async function genScene(ctx, lastChoice) {
  const s = await askJSON(`Você é o motor narrativo do "Modo Realidade". Gere a PRÓXIMA cena curta (3 a 5 frases, segunda pessoa, presente) da vida simulada da pessoa dentro da realidade escolhida, com uma situação concreta que pede decisão${lastChoice ? ", reagindo à última escolha dela" : ""}. Ofereça 3 opções de ação nesta ordem: a primeira coerente com a identidade assumida, a segunda intermediária de observação e a terceira do jeito antigo. Opções curtas e específicas da cena.
Responda só com JSON: {"narrative":"...","options":[{"id":"a","label":"..."},{"id":"b","label":"..."},{"id":"c","label":"..."}]}`, { ...ctx, ultimaEscolha: lastChoice || null });
  if (!s || !s.narrative || !Array.isArray(s.options) || !s.options.length) throw { code: "invalid_json" };
  return { narrative: String(s.narrative), options: s.options.slice(0, 3).map((o, i) => ({ id: "abc"[i], label: String(o.label) })), recap: false, source: "ia" };
}

function showScene(box, scene) {
  const err = h("p", { class: "err" });
  const terca = profile.reality.terca;
  const btns = scene.options.map(o => h("button", { class: "ghost", onclick: () => choose(o) }, o.label));
  async function choose(o) {
    btns.forEach(b => { b.disabled = true; b.classList.toggle("sel", b.textContent === o.label); });
    err.textContent = "";
    if (scene.recap) { await Store.update("cenas", scene.id, { chosen: o.id, chosenLabel: o.label }); return go("reality"); }
    const ta = h("textarea", { id: "cena-resposta", placeholder: "Na sua vida real, o que exatamente você faria? (opcional)", style: "min-height:90px" });
    const nextLabel = aiOn() ? "Continuar a cena" : "Registrar e ver a próxima";
    const next = h("button", { class: "btn" }, nextLabel);
    next.onclick = async () => {
      busy(next, true, aiOn() ? "A cena continua…" : "Registrando…");
      try {
        await Store.update("cenas", scene.id, { chosen: o.id, chosenLabel: o.label, resposta: ta.value.trim() || null });
        if (!aiOn()) return go("reality");
        const nextScene = await genScene(await context(), o.label);
        showScene(box, await Store.add("cenas", { ...nextScene, chosen: null }));
      } catch (e) { err.textContent = aiError(e); busy(next, false, nextLabel); }
    };
    box.append(ta, next, h("button", { class: "link", onclick: async () => { await Store.update("cenas", scene.id, { chosen: o.id, chosenLabel: o.label, resposta: ta.value.trim() || null }); go("home"); } }, "Registrar e voltar ao início"));
    ta.focus();
  }
  box.replaceChildren(...[
    scene.recap && h("span", { class: "label" }, "Enquanto você esteve fora"),
    !scene.recap && terca && h("details", {}, h("summary", { class: "note", style: "text-align:left;cursor:pointer" }, "Lembrar minha terça-feira ideal"), h("div", { class: "card", style: "margin-top:10px" }, terca)),
    h("div", { class: "card" }, scene.narrative),
    h("div", { class: "stack" }, btns), err,
    h("p", { class: "note" }, "Isto é uma simulação da realidade que você escolheu, não uma previsão."),
  ].filter(Boolean));
}

async function render(name, opts) {
  try { await screens[name](opts); }
  catch (e) { console.error(e); screen("", h("p", { class: "err" }, "Algo deu errado ao abrir esta tela."), h("button", { class: "btn", onclick: () => go("home") }, "Voltar ao início")); }
}

/* ---------- Início ---------- */
(async () => {
  const [, s] = await Promise.all([Store.init(), use("sample")]);
  sample = s;
  try { profile = await Store.getProfile(); } catch { profile = null; }
  if (!profile || !profile.dna) return go("onboarding");
  if (!profile.reality) return go("reality-select");
  go("home");
})();
})();
</script>
